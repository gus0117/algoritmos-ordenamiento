<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Algoritmos con pingüinos · C++</title>
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#ece8fa; --panel:#ffffff; --text:#241e44; --muted:#64598f;
  --chip:#f0ecff; --chip-on:#4a3d9e; --chip-on-ink:#ffffff;
  --accent:#f6c915; --accent-ink:#2b2200;
  --shadow:0 6px 18px rgba(60,40,140,.16);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15112b; --panel:#221c42; --text:#efeafc; --muted:#a79cd3;
    --chip:#2f2757; --chip-on:#f6c915; --chip-on-ink:#2b2200;
    --accent:#f6c915; --accent-ink:#2b2200;
    --shadow:0 6px 18px rgba(0,0,0,.4);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#15112b; --panel:#221c42; --text:#efeafc; --muted:#a79cd3;
  --chip:#2f2757; --chip-on:#f6c915; --chip-on-ink:#2b2200;
  --accent:#f6c915; --accent-ink:#2b2200;
  --shadow:0 6px 18px rgba(0,0,0,.4);
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;line-height:1.4;-webkit-text-size-adjust:100%}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid #f6c915;outline-offset:2px}
.app{max-width:1120px;margin:0 auto;padding:12px}

/* ---------- layout ---------- */
.layout{display:flex;flex-direction:column;gap:12px}
.col-l,.col-r{display:contents}
.o1{order:1}.o2{order:2}.o3{order:3}.o4{order:4}.o5{order:5}.o6{order:6}.o7{order:7}.o8{order:8}
@media (min-width:980px){
  .layout{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px;align-items:start}
  .col-l,.col-r{display:flex;flex-direction:column;gap:12px}
  .col-r{position:sticky;top:12px}
}
.card{background:var(--panel);border-radius:18px;padding:12px;box-shadow:var(--shadow)}

/* ---------- algoritmos ---------- */
.algs{display:flex;flex-direction:column;gap:10px}
.grp{display:flex;flex-direction:column;gap:6px}
.cap{font-size:12px;font-weight:700;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:0;background:var(--chip);padding:9px 14px;border-radius:999px;font-weight:650;font-size:14px;min-height:40px;color:var(--text)}
.chip[aria-pressed="true"]{background:var(--chip-on);color:var(--chip-on-ink)}
.info{font-size:13px;color:var(--muted);margin:0}
.info b{color:var(--text)}

/* ---------- escena ---------- */
.stage{--dur:500ms;--lift:50px;position:relative;border-radius:22px;overflow:hidden;height:clamp(340px,82vw,450px);background:linear-gradient(#ad9dd6,#7d6bb3);box-shadow:var(--shadow);isolation:isolate}
.scene{position:absolute;inset:0;width:100%;height:100%}
.snow{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:1}
.snow i{position:absolute;top:-10px;border-radius:50%;background:#fff;opacity:.55;animation:fall linear infinite}
@keyframes fall{to{transform:translate(24px,470px)}}
.ttl{position:absolute;top:14px;left:0;right:0;text-align:center;z-index:9;pointer-events:none}
.ttl h1{margin:0;font-size:clamp(27px,7vw,40px);line-height:1.05;font-weight:900;letter-spacing:-.5px;color:#ffd92e;text-shadow:0 2px 0 #a98100,0 0 22px rgba(255,217,46,.4)}
.ttl .sub{margin-top:4px;font:700 clamp(14px,3.6vw,18px)/1 ui-monospace,"Cascadia Code","SF Mono",Menlo,Consolas,monospace;color:#fff;text-shadow:0 1px 6px rgba(30,10,70,.6);letter-spacing:.04em}
.track{position:absolute;left:16px;right:16px;top:78px;bottom:10px}
.platform{position:absolute;left:0;right:0;bottom:60px;height:34px;border-radius:14px;background:linear-gradient(#f1ebfc 0 30%,#cdc1e6 30% 100%);box-shadow:0 8px 18px rgba(40,20,90,.35),inset 0 -3px 0 rgba(110,90,165,.28);z-index:1}
.ix{position:absolute;top:11px;text-align:center;font:700 11px/22px ui-monospace,Menlo,Consolas,monospace;color:#6a5b9c}

.p{position:absolute;left:0;bottom:86px;z-index:2;transition:transform var(--dur) cubic-bezier(.45,.05,.25,1);will-change:transform}
.p .lift{width:100%;height:100%;transition:transform var(--dur) cubic-bezier(.3,.7,.3,1)}
.p.lifted{z-index:6}
.p.lifted .lift{transform:translateY(calc(var(--lift) * -1))}
.p .pg{width:100%;height:100%;transform-origin:50% 100%;filter:drop-shadow(0 6px 5px rgba(30,15,70,.38));transition:opacity .3s,filter .3s,transform .25s}
.p .ring{position:absolute;left:-14%;right:-14%;bottom:-6px;height:13px;border-radius:50%;border:2.5px solid transparent;opacity:0;transition:opacity .25s,border-color .25s,box-shadow .25s}
.p.less .ring{border-color:#7cc8ff;opacity:.9}
.p.ok .ring{border-color:#5be7a9;opacity:.9}
.p.pivot .ring{border-color:#ff5ea8;opacity:1;box-shadow:0 0 10px #ff5ea8}
.p.cmp{z-index:3}
.p.cmp .ring{border-color:#ffd23f;opacity:1;box-shadow:0 0 12px rgba(255,210,63,.85)}
.p.swap{z-index:5}
.p.swap .ring{border-color:#ff7a59;opacity:1;box-shadow:0 0 12px rgba(255,122,89,.85)}
.p.found .ring{border-color:#ffe066;opacity:1;box-shadow:0 0 16px #ffe066}
.p.key .ring{border-color:#ffd23f;border-style:dashed;opacity:1}
.p.key .pg{filter:drop-shadow(0 0 10px #ffd23f) drop-shadow(0 6px 5px rgba(30,15,70,.38))}
.p.dim .pg{opacity:.45;filter:grayscale(.75) brightness(.85)}
.p.seen .pg{opacity:.55}
.p.found .pg{animation:cheer .75s ease-in-out infinite}
.p.found::after{content:"★";position:absolute;left:50%;top:-24px;transform:translateX(-50%);font-size:20px;color:#ffe066;text-shadow:0 0 8px #ffb300;animation:twinkle 1s ease-in-out infinite}
.p.hop .pg{animation:hop var(--dur) ease-in-out}
.p.jump-up{z-index:8}
.p.jump-up .lift{animation:jump var(--dur) linear}
.p.jump-down{z-index:1}
@keyframes jump{0%{transform:translateY(0);animation-timing-function:cubic-bezier(.2,.7,.4,1)}50%{transform:translateY(calc(var(--jh,40px) * -1));animation-timing-function:cubic-bezier(.6,0,.8,.4)}100%{transform:translateY(0)}}
.p .eyes{transition:transform .2s ease-out}
.p.look-r .eyes{transform:translateX(4.5px)}
.p.look-l .eyes{transform:translateX(-4.5px)}
.p.look-r .pg{transform:rotate(5deg)}
.p.look-l .pg{transform:rotate(-5deg)}
@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-16px)}}
@keyframes cheer{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@keyframes twinkle{0%,100%{opacity:1}50%{opacity:.4}}

.ptr{--c:#b9a8ff;position:absolute;left:0;bottom:34px;font:700 11px/1 ui-monospace,Menlo,Consolas,monospace;padding:4px 7px;border-radius:9px;color:#1d1738;background:var(--c);white-space:nowrap;z-index:7;opacity:0;box-shadow:0 2px 6px rgba(20,10,60,.35);transition:transform var(--dur) cubic-bezier(.45,.05,.25,1),opacity .25s}
.ptr::before{content:"";position:absolute;left:50%;top:-5px;margin-left:-5px;border:5px solid transparent;border-top:0;border-bottom-color:var(--c)}

.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);padding:0 4px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:16px;height:8px;border-radius:50%;border:2px solid var(--c);display:inline-block}

.msg{border-left:5px solid var(--accent);min-height:74px;font-size:15px;display:flex;align-items:center}
.msg p{margin:0}

/* ---------- transporte ---------- */
.transport{display:flex;flex-direction:column;gap:10px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--chip);border-radius:999px;padding:4px}
.seg button{border:0;background:transparent;padding:9px;border-radius:999px;font-weight:700;color:var(--muted);min-height:40px}
.seg button[aria-pressed="true"]{background:var(--chip-on);color:var(--chip-on-ink)}
.btns{display:flex;gap:8px}
.btn{flex:1;border:0;background:var(--chip);color:var(--text);border-radius:14px;padding:11px 8px;font-weight:700;min-height:48px;white-space:nowrap}
.btn.icon{flex:0 0 52px}
.btn.primary{background:var(--accent);color:var(--accent-ink);flex:2}
.btn:disabled{opacity:.4;cursor:default}
.scrub{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted)}
.scrub input{flex:1}
input[type=range]{accent-color:#f6c915;min-width:0}
.speed{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.speed input{flex:1}

/* ---------- código ---------- */
.code{background:#1e1d2c;border-radius:18px;overflow:hidden;box-shadow:var(--shadow);color:#e8e5f7}
.code .bar{display:flex;align-items:center;gap:6px;padding:9px 14px;background:#171625;font:600 12px ui-monospace,Menlo,Consolas,monospace;color:#8f8bb5}
.code .bar i{width:10px;height:10px;border-radius:50%;background:#ff5f57}
.code .bar i:nth-child(2){background:#febc2e}.code .bar i:nth-child(3){background:#28c840}
.code .bar span{margin-left:8px}
.codebox{position:relative;overflow:auto;max-height:min(62vh,470px);padding:8px 0;font:14px/1.75 ui-monospace,"Cascadia Code","SF Mono",Menlo,Consolas,monospace}
.ln{display:flex;min-width:100%;width:max-content;padding-right:16px;box-shadow:inset 4px 0 0 transparent;transition:background .2s}
.ln.on{background:rgba(245,201,66,.17);box-shadow:inset 4px 0 0 #f5c542}
.no{flex:0 0 38px;text-align:right;padding-right:14px;color:#5e5b80;user-select:none}
.tx{white-space:pre}
.k{color:#c792ea}.t{color:#82aaff}.n{color:#f78c6c}.f{color:#ffcb6b}.c{color:#6f6c8e}
.vars{background:#171625;border-top:1px solid #2c2a44;padding:10px 12px;display:flex;flex-wrap:wrap;gap:6px;min-height:50px;align-items:center}
.vars em{font-style:normal;font-size:12px;color:#8f8bb5;margin-right:4px}
.v{font:600 13px ui-monospace,Menlo,Consolas,monospace;background:#2b2a40;border-radius:8px;padding:4px 8px;color:#e8e5f7}
.v b{color:#ffcb6b;font-weight:700}

/* ---------- configuración ---------- */
.settings summary{font-weight:700;cursor:pointer;padding:2px 0}
.settings .body{display:flex;flex-direction:column;gap:12px;margin-top:12px}
.srow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.srow label{font-size:14px}
.srow input[type=range]{flex:1;min-width:120px}
.srow input[type=text],.srow input[type=number]{flex:1;min-width:120px;padding:10px 12px;border-radius:12px;border:2px solid var(--chip);background:var(--bg);color:var(--text)}
.srow .btn{flex:0 0 auto;min-height:42px;padding:8px 14px}
.chk{font-size:14px;display:flex;gap:8px;align-items:center}
.note{font-size:13px;color:var(--muted);margin:0}
.err{font-size:13px;color:#d6336c;min-height:0;margin:0}

.scrub .btn{font-size:20px;min-height:42px;flex:0 0 46px;padding:0}
body.fs-lock{overflow:hidden}
.app.fs{position:fixed;inset:0;width:100vw;height:100vh;height:100dvh;z-index:100;max-width:none;margin:0;padding:0;overflow:hidden;background:linear-gradient(#6f60a8,#54448f)}
.app.fs .layout{height:100vh;height:100dvh;display:flex;flex-direction:column;gap:0}
.app.fs .col-l,.app.fs .col-r{display:contents}
.app.fs .algs,.app.fs .settings,.app.fs .legend,.app.fs .msg,.app.fs .code .bar,.app.fs .vars{display:none}
.app.fs .stage{height:46vh;height:46dvh;flex:0 0 auto;border-radius:0;box-shadow:none}
.app.fs .ttl{top:calc(14px + env(safe-area-inset-top,0px))}
.app.fs .track{top:calc(78px + env(safe-area-inset-top,0px))}
.app.fs .ttl h1{font-size:clamp(30px,9vw,56px)}
.app.fs .code{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;margin:14px 12px max(14px,env(safe-area-inset-bottom));border-radius:22px;background:#1f2030}
.app.fs .codebox{flex:1 1 auto;min-height:0;max-height:none;padding:14px 0}
.app.fs .no{display:none}
.app.fs .tx{padding-left:20px}
.app.fs .transport{position:fixed;left:50%;bottom:max(12px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:20;width:max-content;max-width:calc(100vw - 16px);flex-direction:row;align-items:center;gap:6px;padding:6px 8px;border-radius:999px;background:rgba(20,14,45,.78);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);transition:opacity .4s}
.app.fs.idle .transport{opacity:0;pointer-events:none}
.app.fs .seg,.app.fs .speed,.app.fs .scrub input,.app.fs #count,.app.fs #bReset{display:none}
.app.fs .btns{flex:0 0 auto;gap:6px}
.app.fs .btn{flex:0 0 auto;min-height:40px;padding:8px 12px;font-size:14px}
.app.fs .btn.icon,.app.fs .scrub .btn{flex:0 0 42px;padding:0}
.app.fs .btn.primary{flex:0 0 auto}
.app.fs .scrub{gap:6px}
@media (min-aspect-ratio:5/4){
  .app.fs .layout{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);grid-template-rows:100vh;grid-template-rows:100dvh}
  .app.fs .col-l,.app.fs .col-r{display:flex;flex-direction:column;min-height:0;height:100vh;height:100dvh;position:static}
  .app.fs .stage{height:100vh;height:100dvh}
}
@media (prefers-reduced-motion:reduce){
  .snow{display:none}
  .p.found .pg,.p.found::after{animation:none}
}
</style>
</head>
<body>
<div class="app">
<div class="layout">

<div class="col-l">

  <section class="card algs o1" aria-label="Elegir algoritmo">
    <div class="grp">
      <span class="cap">Ordenamiento</span>
      <div class="chips">
        <button class="chip" data-alg="bubble">Bubble Sort</button>
        <button class="chip" data-alg="insertion">Insertion Sort</button>
        <button class="chip" data-alg="quick">Quick Sort</button>
      </div>
    </div>
    <div class="grp">
      <span class="cap">Búsqueda</span>
      <div class="chips">
        <button class="chip" data-alg="seq">Secuencial</button>
        <button class="chip" data-alg="bin">Binaria</button>
      </div>
    </div>
    <p class="info" id="info"></p>
  </section>

  <section class="stage o2" id="stage">
    <svg class="scene" viewBox="0 0 600 400" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
      <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a999d3"/><stop offset="1" stop-color="#bdb0df"/></linearGradient>
        <linearGradient id="hill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d0c6ea"/><stop offset=".35" stop-color="#9886c8"/><stop offset="1" stop-color="#5a4894"/></linearGradient>
        <linearGradient id="dome" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6f3ff"/><stop offset="1" stop-color="#cfc7ec"/></linearGradient>
        <radialGradient id="door" cx=".5" cy=".7" r=".7"><stop offset="0" stop-color="#fff3bd"/><stop offset="1" stop-color="#ff9f40"/></radialGradient>
        <radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ffd27a" stop-opacity=".55"/><stop offset="1" stop-color="#ffd27a" stop-opacity="0"/></radialGradient>
        <clipPath id="domeClip"><path d="M0 280A100 92 0 0 1 200 280Z"/></clipPath>
        <g id="tree"><polygon points="0,-60 38,10 22,10 52,62 30,62 66,118 -66,118 -30,62 -52,62 -22,10 -38,10"/><rect x="-9" y="118" width="18" height="34"/></g>
      </defs>
      <rect width="600" height="400" fill="url(#sky)"/>
      <use href="#tree" transform="translate(70,20) scale(.8)" fill="#7a68b4" opacity=".8"/>
      <use href="#tree" transform="translate(330,-10) scale(.75)" fill="#7a68b4" opacity=".8"/>
      <use href="#tree" transform="translate(205,0) scale(1.05)" fill="#4f3f8c"/>
      <use href="#tree" transform="translate(455,10) scale(1.15)" fill="#4f3f8c"/>
      <path d="M0 175Q150 128 300 160T600 150V400H0Z" fill="url(#hill)"/>
      <g transform="translate(95,0)">
        <circle cx="100" cy="270" r="95" fill="url(#glow)"/>
        <path d="M0 280A100 92 0 0 1 200 280Z" fill="url(#dome)"/>
        <g id="bricks" clip-path="url(#domeClip)" stroke="#8f84c4" stroke-opacity=".42" stroke-width="1.5" fill="none"></g>
        <path d="M78 280V256Q100 226 122 256V280Z" fill="url(#door)" stroke="#e9e2fb" stroke-width="5"/>
      </g>
    </svg>
    <div class="snow" id="snow"></div>
    <div class="ttl"><h1 id="ttl">Bubble Sort</h1><div class="sub">C++</div></div>
    <div class="track" id="track"><div class="platform" id="platform"></div></div>
  </section>

  <div class="legend o3" id="legend"></div>

  <section class="card msg o3" role="status"><p id="msg"></p></section>

  <section class="card transport o4" aria-label="Controles">
    <div class="seg" role="group" aria-label="Modo">
      <button id="mAuto" aria-pressed="true">Automática</button>
      <button id="mStep" aria-pressed="false">Paso a paso</button>
    </div>
    <div class="btns">
      <button class="btn icon" id="bReset" title="Volver al inicio" aria-label="Volver al inicio">⏮</button>
      <button class="btn" id="bPrev">◀ Atrás</button>
      <button class="btn primary" id="bPlay">▶ Reproducir</button>
      <button class="btn" id="bNext">Siguiente ▶</button>
    </div>
    <div class="scrub"><input type="range" id="scrub" min="0" max="0" value="0" aria-label="Posición en la animación"><span id="count">Paso 1 / 1</span><button class="btn icon" id="bFs" title="Pantalla completa" aria-label="Pantalla completa">⛶</button></div>
    <label class="speed" id="speedBox">🐢 <input type="range" id="speed" min="1" max="10" value="5" aria-label="Velocidad"> 🐇</label>
  </section>

  <details class="card settings o8">
    <summary>Configurar arreglo</summary>
    <div class="body">
      <div class="srow"><label for="nRange">Cantidad: <b id="nVal">8</b></label><input type="range" id="nRange" min="4" max="10" value="8"></div>
      <div class="srow">
        <button class="btn" id="bRand">Aleatorio</button>
        <button class="btn" id="bRev">Invertido</button>
        <button class="btn" id="bNear">Casi ordenado</button>
      </div>
      <label class="chk"><input type="checkbox" id="chkBig"> Aleatorio con valores de 1 a 99</label>
      <div class="srow"><input type="text" id="custom" placeholder="Ej: 7, 4, 2, 1, 8, 3, 6, 5" inputmode="text" aria-label="Arreglo personalizado"><button class="btn" id="bApply">Usar mi arreglo</button></div>
      <p class="err" id="err"></p>
      <div id="searchOnly" hidden>
        <div class="srow"><label for="target">Valor a buscar</label><input type="number" id="target" min="1" max="99" value="3"></div>
        <div class="srow" style="margin-top:8px"><button class="btn" id="bIn">Uno que existe</button><button class="btn" id="bOut">Uno que no existe</button></div>
        <p class="note" id="binNote" hidden style="margin-top:8px">La búsqueda binaria necesita el arreglo ordenado, por eso se muestra ya ordenado.</p>
      </div>
    </div>
  </details>
</div>

<div class="col-r">
  <section class="code o6" aria-label="Código C++">
    <div class="bar"><i></i><i></i><i></i><span id="file">bubble_sort.cpp</span></div>
    <div class="codebox" id="codebox"></div>
    <div class="vars" id="vars"></div>
  </section>
</div>

</div>
</div>

<script>
/* <GEN> */
function makeRec(vals){
  const n = vals.length;
  const at = vals.map((_, i) => i);           // at[posición] = id del pingüino (null = hueco)
  const S = {held:null, done:new Set(), range:null, pivotId:null, less:null, seen:new Set()};
  const frames = [];
  const V = s => vals[at[s]];
  const sw = (a, b) => { const t = at[a]; at[a] = at[b]; at[b] = t; };
  function snap(line, o){
    o = o || {};
    const roles = {};
    const add = (s, c) => { const id = at[s]; if (id != null) roles[id] = (roles[id] || '') + ' ' + c; };
    if (S.range) for (let s = 0; s < n; s++) if ((s < S.range[0] || s > S.range[1]) && !S.done.has(s)) add(s, 'dim');
    S.seen.forEach(s => add(s, 'seen'));
    S.done.forEach(s => add(s, 'ok'));
    if (S.less) for (let s = S.less[0]; s <= S.less[1]; s++) add(s, 'less');
    if (S.pivotId != null) roles[S.pivotId] = (roles[S.pivotId] || '') + ' pivot';
    (o.cmp || []).forEach(s => add(s, 'cmp'));
    (o.swap || []).forEach(s => add(s, 'swap'));
    (o.found || []).forEach(s => add(s, 'found'));

}

/* ---------- escena ---------- */
function buildPenguins(){
  track.querySelectorAll('.p,.ptr').forEach(e => e.remove());
  ptrEls = {};
  const vals = data();
  const uniq = [...new Set(vals)].sort((a, b) => a - b);
  els = vals.map((v, id) => {
    const rank = uniq.indexOf(v);
    const H = uniq.length > 1 ? 150 + Math.round(100 * rank / (uniq.length - 1)) : 190;
    const d = document.createElement('div');
    d.className = 'p'; d.dataset.h = H; d.style.transition = 'none';
    d.innerHTML = `<div class="ring"></div><div class="lift"><div class="pg">${penguinSVG(H, v, SCARVES[id % SCARVES.length])}</div></div>`;
    d.querySelector('.lift').style.transition = 'none';
    track.appendChild(d);
    return d;
  });
  platform.innerHTML = vals.map((_, i) => `<span class="ix">${i}</span>`).join('');
  layout();
  requestAnimationFrame(() => requestAnimationFrame(() => els.forEach(e => { e.style.transition = ''; e.querySelector('.lift').style.transition = ''; })));
}
function layout(){
  const n = els.length; if (!n) return;
  slotW = track.clientWidth / n;
  const maxH = Math.max(24, (track.clientHeight - 96) / 2.9);
  pw = Math.min(slotW * 0.86, fsOn ? 120 : 66, maxH);
  stage.style.setProperty('--lift', Math.max(46, pw) + 'px');
  els.forEach(el => { const H = +el.dataset.h; el.style.width = pw + 'px'; el.style.height = (pw * H / 100) + 'px'; });
  [...platform.children].forEach((s, i) => { s.style.left = (i * slotW) + 'px'; s.style.width = slotW + 'px'; });
  render();
  fitCode();
}
function fitCode(){
  const box = $('#codebox');
  if (!fsOn){ box.style.fontSize = ''; return; }
  const lines = ALG[st.alg].code;
  const maxCh = Math.max(...lines.map(l => l.length));
  const byW = (box.clientWidth - 40) / (maxCh * 0.62);
  const byH = (box.clientHeight - 28) / (lines.length * 1.75);
  box.style.fontSize = Math.max(10, Math.min(30, byW, byH)) + 'px';
}
function ptrEl(k){
  if (!ptrEls[k]){
    const e = document.createElement('div');
    e.className = 'ptr'; e.textContent = k; e.style.setProperty('--c', PC[k] || '#b9a8ff');
    track.appendChild(e); ptrEls[k] = e;
  }
  return ptrEls[k];
}
function render(){
  const f = st.frames[st.idx]; if (!f || !els.length) return;
  const n = els.length;
  els.forEach((el, id) => {
    const slot = f.pos[id];
    const jp = f.jump, fwd = st.idx === lastRendered + 1;
    const lk = f.look && f.look.length === 2 ? f.look : null;
    let lcls = '';
    if (lk && (id === lk[0] || id === lk[1])){ const leftId = f.pos[lk[0]] < f.pos[lk[1]] ? lk[0] : lk[1]; lcls = id === leftId ? ' look-r' : ' look-l'; }
    el.style.transform = `translateX(${slot * slotW + (slotW - pw) / 2}px)`;
    const r = (f.roles[id] || '').trim();
    el.className = 'p' + (r ? ' ' + r : '') + (f.lifted.includes(id) ? ' lifted' : '') + lcls;
    let jcls = '';
    if (fwd && jp && jp.up === id) jcls = 'jump-up';
    else if (fwd && jp && jp.down === id) jcls = 'jump-down';
    if (jcls){
      if (jcls === 'jump-up'){
        const eh = parseFloat(el.style.height) || 0;
        const dh = jp.down != null && els[jp.down] ? (parseFloat(els[jp.down].style.height) || 0) : pw * 0.3;
        const avail = stage.clientHeight - 96 - eh - 30;
        el.style.setProperty('--jh', Math.max(24, Math.min(dh + 16, avail)) + 'px');
      }
      void el.offsetWidth; el.classList.add(jcls);
    } else if (!jp && /\bswap\b/.test(r) && lastRendered !== st.idx){ void el.offsetWidth; el.classList.add('hop'); }
  });
  lastRendered = st.idx;
  clearTimeout(lookTimer);
  if (f.look && f.look.length === 2) lookTimer = setTimeout(() => els.forEach(e => e.classList.remove('look-l', 'look-r')), 500);

  const used = new Set(), count = {};
  Object.entries(f.ptrs).forEach(([k, s]) => {
    if (s < 0 || s >= n) return;
    const row = count[s] || 0; count[s] = row + 1;
    const e = ptrEl(k);
    e.style.transform = `translate(${s * slotW + slotW / 2}px, ${row * 22}px) translateX(-50%)`;
    e.style.opacity = 1; used.add(k);
  });
  Object.keys(ptrEls).forEach(k => { if (!used.has(k)) ptrEls[k].style.opacity = 0; });

  $('#msg').innerHTML = f.msg;
  const lines = $('#codebox').children;
  [...lines].forEach(l => l.classList.remove('on'));
  const ln = lines[f.line];
  if (ln){
    ln.classList.add('on');
    const box = $('#codebox'), top = ln.offsetTop, h = ln.offsetHeight;
    if (top < box.scrollTop + 8) box.scrollTo({top:Math.max(0, top - 8), behavior:'smooth'});
    else if (top + h > box.scrollTop + box.clientHeight - 8) box.scrollTo({top:top + h - box.clientHeight + 8, behavior:'smooth'});
  }
  const entries = Object.entries(f.vars);
  $('#vars').innerHTML = '<em>Variables</em>' + entries.map(([k, v]) => `<span class="v"><b>${k}</b> = ${v}</span>`).join('');

  const last = st.frames.length - 1;
  $('#scrub').max = last; $('#scrub').value = st.idx;
  $('#count').textContent = `Paso ${st.idx + 1} / ${last + 1}`;
  $('#bPrev').disabled = st.idx === 0;
  $('#bReset').disabled = st.idx === 0;
  $('#bNext').disabled = st.idx >= last;
  $('#bPlay').textContent = st.playing ? '⏸ Pausar' : (st.idx >= last ? '↻ Repetir' : '▶ Reproducir');
}

/* ---------- reproducción ---------- */
function setDur(){ st.dur = st.mode === 'auto' ? Math.max(380, Math.min(650, SPEEDS[st.speed - 1] * 0.72)) : 550; stage.style.setProperty('--dur', st.dur + 'ms'); }
function frameDelay(){
  const f = st.frames[st.idx], base = SPEEDS[st.speed - 1];
  if (!f) return base;
  if (f.look && f.look.length === 2) return Math.max(base, 700);
  if (f.jump || Object.values(f.roles).some(r => /\bswap\b/.test(r))) return Math.max(base, st.dur + 60);
  return base;
}
function stop(){ st.playing = false; clearTimeout(st.timer); }
function schedule(){
  clearTimeout(st.timer);
  st.timer = setTimeout(() => {
    if (!st.playing) return;
    if (st.idx < st.frames.length - 1){ st.idx++; render(); schedule(); }
    else { st.playing = false; render(); }
  }, frameDelay());
}
function play(){
  if (st.idx >= st.frames.length - 1) st.idx = 0;
  st.playing = true; render(); schedule();
}
function go(i){ st.idx = Math.max(0, Math.min(st.frames.length - 1, i)); render(); }

function setMode(m){
  st.mode = m; stop(); setDur();
  $('#mAuto').setAttribute('aria-pressed', m === 'auto');
  $('#mStep').setAttribute('aria-pressed', m === 'step');
  $('#bPlay').hidden = m !== 'auto';
  $('#speedBox').hidden = m !== 'auto';
  $('#bNext').classList.toggle('primary', m === 'step');
  render();
  if (m === 'auto') setTimeout(play, 250);
}

/* ---------- datos ---------- */
function shuffle(a){ for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function randomArr(n, big){
  if (!big) return shuffle(Array.from({length:n}, (_, i) => i + 1));
  const s = new Set(); while (s.size < n) s.add(1 + Math.floor(Math.random() * 99));
  return shuffle([...s]);
}
function pickTarget(exists){
  const a = st.arr;
  if (exists) st.target = a[Math.floor(Math.random() * a.length)];
  else { let t, k = 0; do { t = 1 + Math.floor(Math.random() * 99); k++; } while (a.includes(t) && k < 500); st.target = t; }
  $('#target').value = st.target;
}
function rebuild(autoplay){
  stop();
  const a = ALG[st.alg];
  st.frames = a.kind === 'search' ? a.gen(data(), st.target) : a.gen(data());
  st.idx = 0; lastRendered = -1;
  $('#ttl').textContent = a.name;
  $('#info').innerHTML = a.info;
  $('#legend').innerHTML = a.legend.map(([k, t]) => `<span style="--c:${LEG[k]}"><i${k === 'key' ? ' style="border-style:dashed"' : ''}></i>${t}</span>`).join('');
  $('#searchOnly').hidden = a.kind !== 'search';
  $('#binNote').hidden = st.alg !== 'bin';
  document.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', c.dataset.alg === st.alg));
  buildCode(); buildPenguins(); render();
  if (st.mode === 'auto' && autoplay !== false) setTimeout(() => { if (!st.playing && st.idx === 0) play(); }, 700);
}

/* ---------- eventos ---------- */
document.querySelectorAll('.chip').forEach(c => c.addEventListener('click', () => { st.alg = c.dataset.alg; rebuild(); }));
$('#mAuto').addEventListener('click', () => setMode('auto'));
$('#mStep').addEventListener('click', () => setMode('step'));
$('#bPlay').addEventListener('click', () => { st.playing ? (stop(), render()) : play(); });
$('#bNext').addEventListener('click', () => { stop(); go(st.idx + 1); });
$('#bPrev').addEventListener('click', () => { stop(); go(st.idx - 1); });
$('#bReset').addEventListener('click', () => { stop(); go(0); });
$('#scrub').addEventListener('input', e => { stop(); go(+e.target.value); });
$('#speed').addEventListener('input', e => { st.speed = +e.target.value; setDur(); if (st.playing) schedule(); });

$('#nRange').addEventListener('input', e => { $('#nVal').textContent = e.target.value; });
$('#nRange').addEventListener('change', e => { st.arr = randomArr(+e.target.value, $('#chkBig').checked); pickTarget(true); $('#err').textContent = ''; rebuild(); });
$('#bRand').addEventListener('click', () => { const n = +$('#nRange').value; st.arr = randomArr(n, $('#chkBig').checked); pickTarget(true); $('#err').textContent = ''; rebuild(); });
$('#bRev').addEventListener('click', () => { st.arr = st.arr.slice().sort((a, b) => b - a); $('#err').textContent = ''; rebuild(); });
$('#bNear').addEventListener('click', () => {
  const a = st.arr.slice().sort((x, y) => x - y);
  const swaps = 1 + Math.floor(Math.random() * 2);
  for (let k = 0; k < swaps; k++){ const i = Math.floor(Math.random() * (a.length - 1)); [a[i], a[i + 1]] = [a[i + 1], a[i]]; }
  st.arr = a; $('#err').textContent = ''; rebuild();
});
$('#bApply').addEventListener('click', () => {
  const parts = $('#custom').value.split(/[\s,;]+/).filter(Boolean).map(Number);
  if (parts.length < 3 || parts.length > 10) { $('#err').textContent = 'Escribí entre 3 y 10 números separados por comas.'; return; }
  if (parts.some(v => !Number.isInteger(v) || v < 1 || v > 99)) { $('#err').textContent = 'Usá solo números enteros del 1 al 99.'; return; }
  $('#err').textContent = '';
  st.arr = parts; $('#nRange').value = Math.max(4, parts.length); $('#nVal').textContent = parts.length;
  pickTarget(true); rebuild();
});
$('#target').addEventListener('change', e => {
  const v = parseInt(e.target.value, 10);
  if (Number.isInteger(v) && v >= 1 && v <= 99){ st.target = v; rebuild(); } else e.target.value = st.target;
});
$('#bIn').addEventListener('click', () => { pickTarget(true); rebuild(); });
$('#bOut').addEventListener('click', () => { pickTarget(false); rebuild(); });

document.addEventListener('keydown', e => {
  if (/^(INPUT|TEXTAREA|BUTTON|SUMMARY)$/.test(e.target.tagName)) return;
  if (e.key === 'ArrowRight'){ stop(); go(st.idx + 1); }
  else if (e.key === 'ArrowLeft'){ stop(); go(st.idx - 1); }
  else if (e.key === ' ' && st.mode === 'auto'){ e.preventDefault(); st.playing ? (stop(), render()) : play(); }
});

/* ---------- pantalla completa ---------- */
const app = $('.app');
function setFs(on){
  if (on === fsOn) return;
  fsOn = on;
  app.classList.toggle('fs', on); document.body.classList.toggle('fs-lock', on);
  const b = $('#bFs'), lbl = on ? 'Salir de pantalla completa' : 'Pantalla completa';
  b.textContent = on ? '✕' : '⛶'; b.title = lbl; b.setAttribute('aria-label', lbl);
  try {
    if (on){ const rq = app.requestFullscreen || app.webkitRequestFullscreen; if (rq){ const p = rq.call(app); if (p && p.catch) p.catch(() => {}); } }
    else if (document.fullscreenElement || document.webkitFullscreenElement){ const ex = document.exitFullscreen || document.webkitExitFullscreen; const p = ex.call(document); if (p && p.catch) p.catch(() => {}); }
  } catch (e) {}
  showCtl();
  setTimeout(layout, 80);
}
$('#bFs').addEventListener('click', () => setFs(!fsOn));
let idleT = null;
function showCtl(){
  app.classList.remove('idle'); clearTimeout(idleT);
  if (fsOn) idleT = setTimeout(() => { if (fsOn && st.mode === 'auto' && st.playing) app.classList.add('idle'); }, 3000);
}
app.addEventListener('pointerdown', showCtl);
app.addEventListener('pointermove', showCtl);
document.addEventListener('keydown', showCtl);
const onFsChange = () => { if (fsOn && !(document.fullscreenElement || document.webkitFullscreenElement)) setFs(false); };
document.addEventListener('fullscreenchange', onFsChange);
document.addEventListener('webkitfullscreenchange', onFsChange);
document.addEventListener('keydown', e => { if (e.key === 'Escape' && fsOn) setFs(false); });

/* ---------- decoración ---------- */
(function(){
  let b = '';
  for (let r = 0; r < 4; r++){
    const y0 = 280 - 30 * (r + 1);
    b += `<path d="M-10 ${y0}H210"/>`;
    for (let x = (r % 2 ? 0 : 19); x < 210; x += 38) b += `<path d="M${x} ${y0}V${y0 + 30}"/>`;
  }
  $('#bricks').innerHTML = b;
  let s = '';
  for (let i = 0; i < 18; i++){
    const z = 3 + Math.random() * 3;
    s += `<i style="left:${Math.random() * 100}%;width:${z}px;height:${z}px;animation-duration:${6 + Math.random() * 7}s;animation-delay:-${Math.random() * 12}s"></i>`;
  }
  $('#snow').innerHTML = s;
})();

if ('ResizeObserver' in window){ new ResizeObserver(layout).observe(track); new ResizeObserver(fitCode).observe($('#codebox')); } else window.addEventListener('resize', () => { layout(); });
setDur();
$('#target').value = st.target;
rebuild(false);
setMode('auto');
})();
</script>
</body>
</html>
